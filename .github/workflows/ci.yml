name: DocuMind AI CI Test Suite

on:
  push:
    branches: [ main, free-cloud-deploy ]
  pull_request:
    branches: [ main, free-cloud-deploy ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Offline Unit Test Suite
      run: |
        python -m pytest tests/test_loader.py tests/test_chunker.py tests/test_mocked_rag.py tests/test_claude.py tests/test_cloud_rag.py -v
